# default model for all sessions
model: openrouter/deepseek/deepseek-v4-pro

# weak model for background tasks and repo maps
weak-model: openrouter/deepseek/deepseek-v3.2

# disable automatic git commits to keep history strictly under user control
auto-commits: false
# enable prompt caching on the provider side
cache-prompts: true
# use emacs in terminal mode for /editor to ensure proper unicode support when pasting
editor: "emacs -nw"
# load per-model settings (e.g. max_tokens caps via extra_params)
model-settings-file: ~/.aider.model.settings.yml

# automatically load personal coding standards and rules on startup
read:
  - ~/.config/aider/aider-coding-standards.md

# model aliases and presets for quick switching
# using list syntax format for proper parsing
alias:
  - "ds3:openrouter/deepseek/deepseek-v3.2"
  - "ds4:openrouter/deepseek/deepseek-v4-pro"
  - "sonnet:openrouter/anthropic/claude-3.6-sonnet"
  - "flash:openrouter/google/gemini-2.5-flash"
  - "carbon:openrouter/google/gemini-4-carbon"
  - "neon:openrouter/google/gemini-4-neon"
  - "haiku:openrouter/anthropic/claude-3-haiku"
